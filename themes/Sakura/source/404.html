<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - 页面未找到 | 萤雪的博客</title>
  <link rel="icon" href="/images/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f8 0%, #f7f9fc 100%);
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .wrap { text-align: center; padding: 32px; }
    .code { margin: 0; font-size: 120px; line-height: 1; color: #fe9600; font-weight: 700; }
    h1 { margin: 16px 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #777; }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #fe9600;
      color: #fff;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(254,150,0,.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>页面走丢了</h1>
    <p>你访问的页面不存在，或者已经被移动。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
